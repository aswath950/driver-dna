name: Backend CI

on:
  push:
    branches: [main]
    paths:
      - "backend/**"
      - "src/**"
      - ".github/workflows/backend-ci.yml"
  pull_request:
    branches: [main]
    paths:
      - "backend/**"
      - "src/**"
      - ".github/workflows/backend-ci.yml"

jobs:
  test:
    name: lint + alembic + pytest
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: dna
          POSTGRES_PASSWORD: dna
          POSTGRES_DB: driver_dna
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U dna -d driver_dna"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 10

    env:
      DATABASE_URL: postgresql+asyncpg://dna:dna@localhost:5432/driver_dna
      DATABASE_URL_SYNC: postgresql+psycopg://dna:dna@localhost:5432/driver_dna
      OPENAI_API_KEY: ""
      ENV: local

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python 3.13
        uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: pip
          cache-dependency-path: backend/pyproject.toml

      - name: Install backend
        working-directory: backend
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]"

      - name: Ruff
        working-directory: backend
        run: ruff check app tests

      - name: Alembic upgrade
        working-directory: backend
        run: alembic upgrade head

      - name: Pytest
        working-directory: backend
        run: pytest -v --cov=app --cov-report=term-missing

      - name: OpenAPI snapshot (assert 3.1)
        working-directory: backend
        run: |
          python - <<'PY'
          from fastapi.testclient import TestClient
          from app.main import app
          spec = TestClient(app).get("/openapi.json").json()
          assert spec["openapi"].startswith("3.1"), spec["openapi"]
          PY
